kind: LocalResource
apiVersion: git.krateo.io/v1alpha1
metadata:
  name: local-resource-example-from-ref
  namespace: test-system
spec:
  syncEnabled: true
  override: true
  insecure: true # needeed for local gitea with self-signed certificates

  fromResource:
    fileName: Deployment.v1.apps_coredns_kube-system.yaml
    transform:
    - 'del(.metadata.managedFields)'
    fromRef: 
      apiVersion: v1
      resource: configmaps
      name: test-configmap
      namespace: test-system

  toRepo:
    branch: ref
    cloneFromBranch: main
    path: /
    credentials:
      authMethod: basic
      secretRef:
        key: token
        name: gitea-repo-creds
        namespace: test-system
      usernameRef:
        key: username
        name: gitea-repo-creds
        namespace: test-system
    url: https://localhost:8443/admin/test-repo.git

apiVersion: git.krateo.io/v1alpha1
kind: Repo
metadata:
  name: test-repo-fw
spec:
  configMapKeyRef:
    key: values
    name: fw-replace-values
    namespace: default
  enableUpdate: false
  fromRepo:
    authMethod: generic
    branch: main
    path: skeleton/
    usernameRef:
      key: username
      name: git-username
      namespace: default
    secretRef:
      key: token
      name: gh-token
      namespace: default
    url: https://github.com/krateoplatformops/krateo-v2-template-fireworksapp
  toRepo:
    authMethod: generic
    branch: test
    cloneFromBranch: main
    path: test-fw/
    secretRef:
      key: token
      name: gh-token
      namespace: default
    usernameRef:
      key: username
      name: git-username
      namespace: default
    url: https://github.com/krateoplatformops-test/test-fw
  unsupportedCapabilities: true
